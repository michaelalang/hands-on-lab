# Mounted into kind nodes as kubelet --resolv-conf.
# Include real upstream nameservers so CoreDNS's default
# `forward . /etc/resolv.conf` works before 01-configure-cluster-dns.sh runs.
# (A nameserver-less file causes: plugin/forward: no nameservers found)
nameserver 8.8.8.8
nameserver 1.1.1.1
# ndots:3 resolves names with 3+ dots (e.g. *.svc.cluster.local) as absolute first,
# so host search domains are not appended to in-cluster FQDNs.
options ndots:3 timeout:2 attempts:2
