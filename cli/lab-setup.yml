---
apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: labuser
  namespace: lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-admin-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: labuser
  namespace: lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instructions
  namespace: lab
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: instructions
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: instructions
    spec:
      containers:
        - image: quay.io/rhn_support_milang/hands-on-lab:summit2026
          imagePullPolicy: IfNotPresent
          name: container
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /app
              name: app
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: labuser
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: app
