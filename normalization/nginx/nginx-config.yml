apiVersion: v1
data:
  default.conf: "# Trust Kubernetes pod and node network ranges\nset_real_ip_from\
    \  10.0.0.0/8;\nset_real_ip_from  172.16.0.0/12;\nset_real_ip_from  192.168.0.0/16;\n\
    set_real_ip_from  127.0.0.1;\nset_real_ip_from  ::1;\nreal_ip_header    X-Forwarded-For;\n\
    real_ip_recursive on;\n\n# Matches Apache combined format: IP - user [time] \"\
    request\" status bytes \"ref\" \"ua\"\nlog_format combined_realip '$remote_addr\
    \ - $remote_user [$time_local] '\n                           '\"$request\" $status\
    \ $body_bytes_sent '\n                           '\"$http_referer\" \"$http_user_agent\"\
    ';\n\nserver {\n    listen 8080;\n    server_name _;\n\n    access_log /dev/stdout\
    \ combined_realip;\n    error_log  /dev/stderr warn;\n\n    location / {\n   \
    \     root   /usr/share/nginx/html;\n        index  index.html;\n\n        # If\
    \ using HTTP Basic Auth, $remote_user is automatically populated:\n        auth_basic\
    \           \"Restricted Access\";\n        auth_basic_user_file /etc/nginx/.htpasswd;\n\
    \n        # If authentication is handled by an external OAuth/Ingress gateway,\n\
    \        # you can map the user header into the logs instead:\n        # set $remote_user\
    \ $http_x_remote_user;\n    }\n}"
kind: ConfigMap
metadata:
  name: nginx-config
