apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: lokistack
  namespace: openshift-logging
spec:
  hashRing:
    type: memberlist
  limits:
    global:
      ingestion:
        ingestionRate: 10
      otlp: {}
      queries:
        queryTimeout: 3m
      retention:
        days: 2
  managementState: Managed
  size: 1x.demo
  storage:
    schemas:
      - effectiveDate: '2026-11-09'
        version: v13
    secret:
      name: lokistack-s3
      type: s3
    tls:
      caKey: service-ca.crt
      caName: openshift-service-ca.crt
  storageClassName: ocs-external-storagecluster-ceph-rbd
  template:
    gateway:
      replicas: 2
    indexGateway:
      replicas: 2
    ingester:
      replicas: 3
    querier:
      replicas: 2
    queryFrontend:
      replicas: 2
  tenants:
    mode: openshift-logging

